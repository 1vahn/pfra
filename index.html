<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Air Force ROTC PFRA Scoring Calculator</title>
  <style>
    :root {
      --usaf-blue: #003087;
      --usaf-dark-blue: #001A4D;
      --usaf-gold: #FFC72C;
      --usaf-silver: #E8ECEF;
      --bg-gradient: linear-gradient(135deg, #0b1d3a 0%, #003087 50%, #1a4275 100%);
      --card-bg: rgba(255, 255, 255, 0.96);
      --text-dark: #1C252E;
      --text-muted: #5A6A80;
      --pass-green: #1B8755;
      --fail-red: #D9381E;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: var(--bg-gradient);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      color: var(--text-dark);
    }

    .calculator-card {
      background: var(--card-bg);
      width: 100%;
      max-width: 480px;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    header h1 {
      color: var(--usaf-blue);
      font-size: 1.4rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 500;
    }

    /* Gender Toggle Switch */
    .gender-toggle {
      display: flex;
      background-color: var(--usaf-silver);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 20px;
    }

    .gender-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-muted);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .gender-btn.active {
      background-color: var(--usaf-blue);
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(0, 48, 135, 0.3);
    }

    /* Form Fields */
    .input-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group.full-width {
      grid-column: span 2;
    }

    label {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--usaf-dark-blue);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 2px solid #D0D7DE;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-dark);
      background-color: #FAFAFA;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: var(--usaf-blue);
      background-color: #FFFFFF;
    }

    .time-inputs {
      display: flex;
      gap: 8px;
    }

    .time-inputs input {
      text-align: center;
    }

    /* Score Output Display */
    .results-card {
      background-color: #FFFFFF;
      border-radius: 14px;
      padding: 16px;
      border: 1px solid #E1E6EB;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.02);
    }

    .score-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px dashed #E1E6EB;
      font-size: 0.9rem;
    }

    .score-item:last-child {
      border-bottom: none;
    }

    .score-item .label {
      color: var(--text-muted);
      font-weight: 600;
    }

    .score-item .val {
      font-weight: 700;
      color: var(--text-dark);
    }

    .total-banner {
      margin-top: 12px;
      padding: 14px;
      border-radius: 10px;
      text-align: center;
      background-color: var(--usaf-silver);
      transition: background 0.3s ease;
    }

    .total-banner.pass {
      background-color: #E8F5E9;
      border: 1px solid var(--pass-green);
    }

    .total-banner.fail {
      background-color: #FFEBEE;
      border: 1px solid var(--fail-red);
    }

    .total-score-text {
      font-size: 1.6rem;
      font-weight: 900;
      color: var(--usaf-dark-blue);
    }

    .status-text {
      font-size: 0.85rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      margin-top: 2px;
      text-transform: uppercase;
    }

    .pass .status-text { color: var(--pass-green); }
    .fail .status-text { color: var(--fail-red); }
  </style>
</head>
<body>

<div class="calculator-card">
  <header>
    <h1>Air Force ROTC PFRA Scoring Calculator</h1>
    <p>Official Assessment Standards</p>
  </header>

  <!-- Gender Selector Button -->
  <div class="gender-toggle">
    <button type="button" class="gender-btn active" id="btnMale" onclick="setGender('male')">Male</button>
    <button type="button" class="gender-btn" id="btnFemale" onclick="setGender('female')">Female</button>
  </div>

  <div class="input-grid">
    <!-- Age Input -->
    <div class="form-group">
      <label for="age">Age</label>
      <input type="number" id="age" value="20" min="17" max="69" oninput="calculateScore()">
    </div>

    <!-- WHtR Decimal Input -->
    <div class="form-group">
      <label for="whtr">WHtR (Decimal)</label>
      <input type="number" id="whtr" step="0.01" placeholder="0.48" min="0.30" max="0.70" oninput="calculateScore()">
    </div>

    <!-- HRP Input -->
    <div class="form-group">
      <label for="hrp">2-Min HR Push-ups</label>
      <input type="number" id="hrp" placeholder="Reps" min="0" oninput="calculateScore()">
    </div>

    <!-- Sit-ups Input -->
    <div class="form-group">
      <label for="situps">1-Min Sit-ups</label>
      <input type="number" id="situps" placeholder="Reps" min="0" oninput="calculateScore()">
    </div>

    <!-- 2-Mile Run Time -->
    <div class="form-group full-width">
      <label>2-Mile Run Time</label>
      <div class="time-inputs">
        <input type="number" id="runMin" placeholder="Minutes" min="0" max="59" oninput="calculateScore()">
        <input type="number" id="runSec" placeholder="Seconds" min="0" max="59" oninput="calculateScore()">
      </div>
    </div>
  </div>

  <!-- Results Section -->
  <div class="results-card">
    <div class="score-item">
      <span class="label">Body Comp (WHtR):</span>
      <span class="val" id="scoreWhtr">0 / 20</span>
    </div>
    <div class="score-item">
      <span class="label">2-Min HR Push-ups:</span>
      <span class="val" id="scoreHrp">0 / 15</span>
    </div>
    <div class="score-item">
      <span class="label">1-Min Sit-ups:</span>
      <span class="val" id="scoreSitups">0 / 15</span>
    </div>
    <div class="score-item">
      <span class="label">2-Mile Run:</span>
      <span class="val" id="scoreRun">0 / 50</span>
    </div>

    <div id="totalBanner" class="total-banner">
      <div class="total-score-text" id="totalScore">0</div>
      <div class="status-text" id="statusText">ENTER DATA</div>
    </div>
  </div>
</div>

      for (let ptsStr in pointsObj) {
        let timeStr = pointsObj[ptsStr].replace('<=', '').replace('*', '').trim();
        let parts = timeStr.split(':');
        let totalSec = (parseInt(parts[0]) * 60) + parseInt(parts[1]);
        list.push({ points: parseFloat(ptsStr), maxSec: totalSec });

      // Sort array by max seconds ascending

    if (whtr <= 0.53) return { score: 12, passed: true };
    if (whtr <= 0.55) return { score: 8, passed: true };
    return { score: 0, passed: false };
  }

  // Repetition Events (HR Push-ups, Sit-ups)
  function getRepScore(reps, min, max, maxPts) {
    if (isNaN(reps) || reps < min) return { score: 0, passed: false };
    if (reps >= max) return { score: maxPts, passed: true };
    
    const minPts = 2.5;
    const pts = minPts + Math.floor(((reps - min) / (max - min)) * (maxPts - minPts) * 2) / 2;
    return { score: pts, passed: true };
  }

  // 2-Mile Run Lookup Engine using provided JSON dataset
  function getRunScore(totalSec, ageGroupKey, gender) {
    if (isNaN(totalSec) || totalSec === 0) return { score: 0, passed: false };
    
    const table = ProcessedRunStandards[ageGroupKey][gender];
    
    // Check if time is faster than or equal to 50.0 point cutoff
    if (totalSec <= table[0].maxSec) {
      return { score: table[0].points, passed: true };
    }

    // Iterate through lookup bands
    for (let i = 0; i < table.length; i++) {
      if (totalSec <= table[i].maxSec) {
        return { score: table[i].points, passed: true };
      }
    }

    // Over maximum allowed time -> Fail (0 pts)
    return { score: 0, passed: false };
  }

  function calculateScore() {
    const age = parseInt(document.getElementById('age').value) || 20;
    const whtr = parseFloat(document.getElementById('whtr').value);
    const hrp = parseInt(document.getElementById('hrp').value);
    const situps = parseInt(document.getElementById('situps').value);
    const runMin = parseInt(document.getElementById('runMin').value);
    const runSec = parseInt(document.getElementById('runSec').value);

    const totalRunSeconds = ((isNaN(runMin) ? 0 : runMin) * 60) + (isNaN(runSec) ? 0 : runSec);
    const ageGroupKey = getAgeGroupKey(age);
    const std = Standards[selectedGender][ageGroupKey];

    // Compute component scores
    const whtrRes = getWHtRScore(whtr);
    const hrpRes = getRepScore(hrp, std.hrpMin, std.hrpMax, 15);
    const sitRes = getRepScore(situps, std.sitMin, std.sitMax, 15);
    const runRes = getRunScore(totalRunSeconds, ageGroupKey, selectedGender);

    // Update UI elements
    document.getElementById('scoreWhtr').textContent = `${whtrRes.score} / 20`;
    document.getElementById('scoreHrp').textContent = `${hrpRes.score} / 15`;
    document.getElementById('scoreSitups').textContent = `${sitRes.score} / 15`;
    document.getElementById('scoreRun').textContent = `${runRes.score} / 50`;

    const totalScore = whtrRes.score + hrpRes.score + sitRes.score + runRes.score;
    const totalBanner = document.getElementById('totalBanner');
    const statusText = document.getElementById('statusText');
    const totalScoreDisplay = document.getElementById('totalScore');

    totalScoreDisplay.textContent = totalScore;

    // Minimum validation checks
    const hasEnteredAll = !isNaN(whtr) && !isNaN(hrp) && !isNaN(situps) && totalRunSeconds > 0;

    if (!hasEnteredAll) {
      totalBanner.className = "total-banner";
      statusText.textContent = "ENTER ALL VALUES";
      return;
    }

    const passedMinimums = whtrRes.passed && hrpRes.passed && sitRes.passed && runRes.passed;
    const passedOverall = totalScore >= 75.0 && passedMinimums;

    if (passedOverall) {
      totalBanner.className = "total-banner pass";
      statusText.textContent = totalScore >= 90.0 ? "PASS (EXCELLENT)" : "PASS (SATISFACTORY)";
    } else {
      totalBanner.className = "total-banner fail";
      if (!whtrRes.passed) {
        statusText.textContent = "FAIL (WHtR EXCEEDS 0.55)";
      } else if (!passedMinimums) {
        statusText.textContent = "FAIL (MINIMUM NOT MET)";
      } else {
        statusText.textContent = "FAIL (SCORE BELOW 75.0)";
      }
    }
  }

  // Initial calculation trigger on page load
  calculateScore();
</script>
